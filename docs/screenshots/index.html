<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小宇宙车机版 0.0.2 界面</title><style>
:root{--bg:#f5f4f2;--fg:#161517;--muted:rgba(60,60,67,.6);--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0c;--fg:#f2f2f2;--muted:rgba(235,235,245,.6);--card:#161618}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"PingFang SC",sans-serif}
main{max-width:1400px;margin:0 auto;padding:24px 16px}h1{font-size:24px;margin:0 0 4px}p{color:var(--muted);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:20px}
figure{margin:0;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 5px 40px rgba(0,0,0,.08)}
img{width:100%;display:block;background:#000}figcaption{padding:10px 14px}figcaption b{display:block}figcaption span{color:var(--muted);font-size:13px}
@media (max-width:480px){.grid{grid-template-columns:1fr}}
</style></head><body><main><h1>小宇宙车机版 0.0.2 · 界面截图</h1>
<p>本地渲染（Paparazzi，不需要模拟器），用真实公开内容和真实封面。车机横屏按 1280×720dp 渲染。这些图是用 App 的同一套组件拼出的页面，不是运行中 App 的截屏；转场动画只能在真机上看。</p>
<div class="grid"><figure><img src="discoverLight.png" loading="lazy" alt="发现"><figcaption><b>发现</b><span>浅色。搜索条、入口色块（分类 / 榜单 / 编辑精选）、「为你推荐」横向分页，可换一批</span></figcaption></figure>
<figure><img src="discoverDark.png" loading="lazy" alt="发现 · 深色"><figcaption><b>发现 · 深色</b><span>深色模式；切换外观时颜色渐变过渡</span></figcaption></figure>
<figure><img src="recommendLight.png" loading="lazy" alt="推荐"><figcaption><b>推荐</b><span>分类胶囊 + 按节目封面取色的单集卡片（分类接口实测可用）</span></figcaption></figure>
<figure><img src="recommendDark.png" loading="lazy" alt="推荐 · 深色"><figcaption><b>推荐 · 深色</b><span>卡片底色随深色模式压暗</span></figcaption></figure>
<figure><img src="updatesLight.png" loading="lazy" alt="订阅 · 更新"><figcaption><b>订阅 · 更新</b><span>订阅节目的新单集，默认只看「未听 + 在听」；在听显示剩余时间和进度环</span></figcaption></figure>
<figure><img src="updatesDarkLargest.png" loading="lazy" alt="订阅 · 深色 · 特大"><figcaption><b>订阅 · 深色 · 特大</b><span>显示大小调到「特大」时不裁切</span></figcaption></figure>
<figure><img src="searchResultsLight.png" loading="lazy" alt="搜索结果"><figcaption><b>搜索结果</b><span>左边相关节目、右边单集，关键词高亮；付费单集置灰</span></figcaption></figure>
<figure><img src="meLight.png" loading="lazy" alt="我的"><figcaption><b>我的</b><span>账号、收听历史、车机信息、关于；外观三选一、显示大小刻度滑杆</span></figcaption></figure>
<figure><img src="playerFull.png" loading="lazy" alt="全屏播放页"><figcaption><b>全屏播放页</b><span>点迷你播放条从底部滑出；进度条可点可拖，倍速、定时关闭</span></figcaption></figure>
<figure><img src="narrowSplitLight.png" loading="lazy" alt="分屏 1/3"><figcaption><b>分屏 1/3</b><span>窄屏时改用底部导航</span></figcaption></figure>
<figure><img src="queueLight.png" loading="lazy" alt="播放列表"><figcaption><b>播放列表</b><span>上移 / 下移 / 移除</span></figcaption></figure>
<figure><img src="queueLightLargest.png" loading="lazy" alt="播放列表 · 特大"><figcaption><b>播放列表 · 特大</b><span>按钮换到第二行，标题不被挤</span></figcaption></figure>
<figure><img src="loginLight.png" loading="lazy" alt="登录 · 等待扫码"><figcaption><b>登录 · 等待扫码</b><span>横屏浅色</span></figcaption></figure>
<figure><img src="loginDarkScannedPortrait.png" loading="lazy" alt="登录 · 已扫码"><figcaption><b>登录 · 已扫码</b><span>竖屏深色</span></figcaption></figure></div></main></body></html>
