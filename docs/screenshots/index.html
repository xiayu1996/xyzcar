<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小宇宙车机版 0.0.1 界面</title><style>
:root{--bg:#f5f4f2;--fg:#161517;--muted:rgba(60,60,67,.6);--card:#fff}

body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"PingFang SC",sans-serif}

<figure><img src="loginDarkScannedPortrait.png" loading="lazy" alt="登录 · 已扫码"><figcaption><b>登录 · 已扫码</b><span>竖屏深色。手机扫码后提示在手机上确认</span></figcaption></figure>

<figure><img src="subscriptionsLight.png" loading="lazy" alt="订阅"><figcaption><b>订阅</b><span>星标节目置顶；节目主题色用作强调色</span></figcaption></figure>

<figure><img src="podcastEpisodesLight.png" loading="lazy" alt="节目页"><figcaption><b>节目页</b><span>节目头部 + 单集列表，强调色取节目主题色</span></figcaption></figure>
