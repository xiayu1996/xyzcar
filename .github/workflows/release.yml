name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "已发布的 tag，只同步到 Gitee"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches versionName
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          [ "$tag" = "$ver" ] || { echo "::error::tag v$tag != versionName $ver"; exit 1; }
          echo "VERSION=$ver" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::missing secret for $v"; exit 1; }
          done
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 -d > signing/release.jks
          {
            echo "storeFile=signing/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > signing/signing.properties

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest --tests '*ParsingTest' --tests '*AuthFlowTest' --tests '*PagedHolderTest'

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --print-certs "$apk" | tee /dev/stderr \
            | grep -qi 4a9cd6451ec8d5bbe217f9bbd70d97c67652010347ac9befa3996a85a957befa \
            || { echo "::error::unexpected signing certificate"; exit 1; }
          cp "$apk" "xyzcar-$VERSION.apk"
          sha256sum "xyzcar-$VERSION.apk" > "xyzcar-$VERSION.apk.sha256"
          rm -rf signing

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "xyzcar-$VERSION.apk" "xyzcar-$VERSION.apk.sha256" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  gitee:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GITEE_REPO: xiayuryan/xyzcar
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Gitee 只放 README + 发行包，不放源码
      - name: Sync README-only main and tag to Gitee
        env:
          GIT_AUTHOR_NAME: xyzcar-ci
          GIT_AUTHOR_EMAIL: ci@xyzcar.invalid
          GIT_AUTHOR_DATE: "2026-11-06T00:00:00+08:00"
          GIT_COMMITTER_NAME: xyzcar-ci
          GIT_COMMITTER_EMAIL: ci@xyzcar.invalid
          GIT_COMMITTER_DATE: "2026-11-06T00:00:00+08:00"
        run: |
          [ -n "$GITEE_TOKEN" ] || { echo "::error::missing secret GITEE_TOKEN"; exit 1; }
          remote="https://${GITEE_REPO%%/*}:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          api="https://gitee.com/api/v5/repos/$GITEE_REPO/releases"
          git init -q -b main mirror && cd mirror
          cat > README.md <<'MD'
          # 小宇宙车机版（安装包下载）

          本仓库只提供国内下载，不含源码。

          - 下载：右侧「发行版」→ `xyzcar-<版本>.apk`，可用同名 `.sha256` 校验
          - 源码、使用说明、问题反馈：https://github.com/xiayu1996/xyzcar
          - 许可：PolyForm Noncommercial 1.0.0，禁止任何商业用途

          非官方第三方客户端，与小宇宙官方无关。
          MD
          git add README.md && git commit -q -m "docs: release mirror readme"
          head=$(git rev-parse HEAD)
          git push -q --force "$remote" main:main
          # 删除指向其他提交的 tag（连同其发行版），保证 Gitee 上没有源码
          git ls-remote --tags "$remote" | while read -r sha ref; do
            t=${ref#refs/tags/}; t=${t%^{\}}
            [ "$sha" = "$head" ] && continue
            rid=$(curl -s "$api/tags/$t?access_token=$GITEE_TOKEN" | jq -r '.id // empty' || true)
            [ -n "$rid" ] && curl -sf -X DELETE "$api/$rid?access_token=$GITEE_TOKEN" && echo "deleted release $t"
            git push -q "$remote" --delete "refs/tags/$t" && echo "deleted tag $t"
          done
          git push -q "$remote" "$head:refs/tags/$TAG" 2>/dev/null || true
          git ls-remote "$remote"

      - name: Collect assets
        run: |
          mkdir out
          gh release download "$TAG" --pattern 'xyzcar-*' --dir out
          cd out
          for apk in *.apk; do
            [ -f "$apk.sha256" ] && continue
            sha256sum "$apk" > "$apk.sha256"
            gh release upload "$TAG" "$apk.sha256"
          done
          sha256sum -c *.sha256

      - name: Publish Gitee release
        run: |
          api="https://gitee.com/api/v5/repos/$GITEE_REPO/releases"
          id=$(curl -s "$api/tags/$TAG?access_token=$GITEE_TOKEN" | jq -r '.id // empty' || true)
          if [ -z "$id" ]; then
            body=$(gh release view "$TAG" --json body -q .body)
            id=$(curl -sf -X POST "$api" --form-string "access_token=$GITEE_TOKEN" \
              --form-string "tag_name=$TAG" --form-string "name=$TAG" \
              --form-string "body=${body:-$TAG}" --form-string "target_commitish=main" | jq -r .id)
          fi
          [ -n "$id" ] && [ "$id" != null ] || { echo "::error::create Gitee release failed"; exit 1; }
          have=$(curl -sf "$api/$id/attach_files?access_token=$GITEE_TOKEN" | jq -r '.[].name')
          for f in out/*; do
            n=$(basename "$f")
            grep -qxF "$n" <<<"$have" && { echo "skip $n"; continue; }
            curl -sf -X POST "$api/$id/attach_files" --form-string "access_token=$GITEE_TOKEN" -F "file=@$f" | jq -r .name
          done
          curl -sf "https://gitee.com/api/v5/repos/$GITEE_REPO/releases/latest" | jq -r '.tag_name, (.assets[].browser_download_url)'
